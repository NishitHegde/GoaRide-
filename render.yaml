services:
  # Express Backend Web Service
  - type: web
    name: goaride-backend
    env: node
    buildCommand: npm --prefix server install
    startCommand: npm --prefix server start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # React Frontend Static Site
  - type: web
    name: goaride-frontend
    env: static
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
